services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bridgeroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bridgeroute}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridgeroute}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No ports exposed — only accessible via Docker network

  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-bridgeroute}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bridgeroute}
      # Optional Kilo API key (free models work anonymously without it)
      - KILO_API_KEY=${KILO_API_KEY:-}
      - KILO_CATALOG_REFRESH_SECONDS=${KILO_CATALOG_REFRESH_SECONDS:-300}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:
  postgres_data:
